name: CI — development

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  frontend:
    name: Frontend — test & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pinned, not `latest`: pnpm 11 requires Node >= 22.13, so a floating
      # `latest` silently broke CI at install time on a Node 20 runner. Bump
      # this deliberately, together with node-version, and keep it in step with
      # the lockfileVersion (9.0 => pnpm 9/10).
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test --no-coverage

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_PRE }}

  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pinned, not `latest`: pnpm 11 requires Node >= 22.13, so a floating
      # `latest` silently broke CI at install time on a Node 20 runner. Bump
      # this deliberately, together with node-version, and keep it in step with
      # the lockfileVersion (9.0 => pnpm 9/10).
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Match Vercel's install (pnpm + pnpm-lock.yaml). --frozen-lockfile fails
      # the build if pnpm-lock.yaml drifts from package.json, so lockfile
      # mismatches are caught here instead of at deploy time.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Check-only (no --fix): CI must fail on lint errors, not quietly repair
      # them in the runner and pass. Use `pnpm lint:fix` locally.
      - name: Lint
        run: pnpm lint

      # mongodb-memory-server fetches the mongod binary lazily, on first use,
      # and jest.setup.js calls MongoMemoryServer.create() once PER TEST FILE.
      # On a cold cache every Jest worker therefore races for the same download
      # and the same lockfile; the loser dies with "Cannot unlock file
      # .../mongodb-binaries/<v>.lock, because it is not locked by this process"
      # and takes its entire suite with it. One lost race surfaced as 25 failed
      # tests on a commit that touched no backend code.
      #
      # Fetch it once, serially, before Jest starts — that alone removes the
      # race. The cache just means most runs skip the download altogether; it is
      # keyed on the lockfile so a mongodb-memory-server bump (which can change
      # the mongod version it wants) misses the cache instead of using a stale
      # binary.
      - name: Cache mongod binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/pnpm-lock.yaml') }}

      - name: Pre-fetch mongod binary
        run: >
          node -e "const { MongoMemoryServer } = require('mongodb-memory-server');
          MongoMemoryServer.create()
          .then(s => s.stop())
          .then(() => console.log('mongod binary ready'))
          .catch(e => { console.error(e); process.exit(1) })"

      - name: Test
        run: pnpm test
