name: CI — master

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend — test & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned, not `latest`: pnpm 11 requires Node >= 22.13, so a floating
      # `latest` silently broke CI at install time on a Node 20 runner. Bump
      # this deliberately, together with node-version, and keep it in step with
      # the lockfileVersion (9.0 => pnpm 9/10).
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test --no-coverage

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned, not `latest`: pnpm 11 requires Node >= 22.13, so a floating
      # `latest` silently broke CI at install time on a Node 20 runner. Bump
      # this deliberately, together with node-version, and keep it in step with
      # the lockfileVersion (9.0 => pnpm 9/10).
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Match Vercel's install (pnpm + pnpm-lock.yaml). --frozen-lockfile fails
      # the build if pnpm-lock.yaml drifts from package.json, so lockfile
      # mismatches are caught here instead of at deploy time.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Check-only (no --fix): CI must fail on lint errors, not quietly repair
      # them in the runner and pass. Use `pnpm lint:fix` locally.
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
